# Render Blueprint — free web service for the Post Pipeline backend.
# Postgres is hosted separately on Neon (free); paste its connection string
# into DATABASE_URL. Secrets are marked sync:false so Render prompts for them
# in the dashboard on first deploy (never commit them).
services:
  - type: web
    name: post-pipeline-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL          # Neon connection string (include ?sslmode=require)
        sync: false
      - key: SESSION_SECRET        # any long random string — keep it stable
        sync: false
      - key: GOOGLE_CLIENT_ID      # from Google Cloud OAuth client
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_DOMAIN
        value: moonbug.com
      - key: ADMIN_EMAILS
        value: chris.kuziara@moonbug.com
      - key: DEV_LOGIN             # email sign-in; set "false" once Google SSO works
        value: "true"
      - key: ACCESS_CODE           # REQUIRED while DEV_LOGIN is true on a public URL —
        sync: false                # shared team code, else anyone with the link can sign in
      # BYOK relay (keyvault.js): needs Postgres AND at least one MASTER_KEY_V*,
      # or /api/save-key, /api/key and /api/call-gemini 503 — gracefully, but
      # silently, since nothing else here says these two are required.
      #   1. openssl rand -base64 32
      #   2. paste it as MASTER_KEY_V1 below
      - key: MASTER_KEY_V1
        sync: false
      - key: MASTER_KEY_CURRENT    # which MASTER_KEY_V* is used for new/re-saved keys.
        value: "1"                 # bump alongside adding MASTER_KEY_V2 to rotate —
                                    # old rows still decrypt under v1 until re-saved.
      # Slack bridge (slack-bridge.js): needs Postgres AND both of these, or
      # /slack/events falls through to the main dispatcher's 404/405 and
      # Slack's own request-verification handshake fails. Get both from
      # api.slack.com/apps → your app → OAuth & Permissions (bot token) and
      # Basic Information → App Credentials (signing secret).
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: APP_URL               # this service's own public URL — without it,
        sync: false                # Slack Task Card "Open in Post Pipeline" links
                                    # post with no URL at all
      # NOTE: MASTER_PATH is deliberately NOT set here. The production-folder
      # automation (/api/folders, /api/task/*) and "open in app" actions need a
      # mounted LucidLink volume and a local desktop to spawn apps on, so they
      # only work when the server runs on a studio machine. Hosted, those routes
      # fail gracefully ("Master directory not found — is LucidLink mounted?")
      # while the board, timeline, admin and SSO all work normally.
